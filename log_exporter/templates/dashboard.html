<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LogPort 日志中心</title><link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}"></head>
<body><aside><div class="brand"><span>L</span> LogPort</div><nav><button data-tab="export" class="active">日志导出</button><button data-tab="tasks">任务记录</button><button data-tab="servers">服务器管理</button></nav><button id="logout" class="logout">退出登录</button></aside>
<main class="content"><header><div><h1 id="page-title">日志导出</h1><p>选择目标与时间范围，后台安全生成日志文件</p></div><div class="status-dot">服务运行中</div></header>
<section id="export" class="panel tab active"><h2>创建导出任务</h2><form id="export-form" class="grid"><label>服务器<select id="server-select" required></select></label><label>容器<select id="container-select" required></select></label>
<div class="span-2 mode"><button type="button" data-mode="recent" class="active">最近一段时间</button><button type="button" data-mode="range">指定时间范围</button></div>
<div id="recent-fields" class="span-2 inline"><label>导出当前时间之前<input id="recent-value" type="number" value="30" min="1" required></label><label>单位<select id="recent-unit"><option value="minutes">分钟</option><option value="hours">小时</option></select></label></div>
<div id="range-fields" class="span-2 inline hidden"><label>开始时间<input id="start-time" type="datetime-local"></label><label>结束时间<input id="end-time" type="datetime-local"></label></div>
<div id="export-error" class="alert hidden span-2"></div><button class="primary span-2" type="submit">导出并生成下载</button></form></section>
<section id="tasks" class="panel tab"><div class="section-head"><h2>任务记录</h2><button id="refresh-tasks">刷新</button></div><div class="table-wrap"><table><thead><tr><th>任务</th><th>服务器 / 容器</th><th>时间范围</th><th>状态</th><th>命令</th><th>执行时间</th><th>操作</th></tr></thead><tbody id="task-list"></tbody></table></div></section>
<section id="servers" class="panel tab"><div class="section-head"><h2>服务器管理</h2><button id="new-server" class="primary">添加服务器</button></div><div id="server-cards" class="cards"></div></section></main>
<dialog id="server-dialog"><form id="server-form" class="grid"><div class="span-2 section-head"><h2>服务器配置</h2><button type="button" id="close-dialog">×</button></div><input type="hidden" name="id"><label>显示名称<input name="name" required></label><label>主机地址<input name="host" required></label><label>SSH 端口<input name="port" type="number" value="22" required></label><label>用户名<input name="username" required></label><label>认证方式<select name="auth_type"><option value="private_key">SSH 私钥</option><option value="password">密码</option></select></label><label>凭据（编辑时留空不修改）<textarea name="secret" rows="4"></textarea></label><label class="span-2">私钥口令（可选）<input name="key_passphrase" type="password"></label><label class="span-2">容器白名单（每行一个）<textarea name="containers" rows="4" required></textarea></label><div id="server-error" class="alert hidden span-2"></div><button class="primary span-2">保存服务器</button></form></dialog>
<div id="toast"></div><script src="{{ url_for('static', filename='app.js') }}"></script></body></html>
