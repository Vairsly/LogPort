<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>登录 · LogPort</title><link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}"></head>
<body class="login-body"><main class="login-card"><div class="brand-mark">L</div><h1>LogPort</h1><p>安全、快速地导出服务器日志</p>
<form id="login-form"><label>用户名<input name="username" autocomplete="username" required></label><label>密码<input type="password" name="password" autocomplete="current-password" required></label>
<div id="error" class="alert hidden"></div><button class="primary full" type="submit">进入控制台</button></form></main>
<script>document.querySelector('#login-form').onsubmit=async(e)=>{e.preventDefault();const body=Object.fromEntries(new FormData(e.target));const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const d=await r.json();if(r.ok)location='/';else{const x=document.querySelector('#error');x.textContent=d.error;x.classList.remove('hidden')}};</script></body></html>
